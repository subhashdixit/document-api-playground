[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.black]
line-length = 88
[tool.pylint.messages_control]
disable = ["too-few-public-methods", "too-many-locals", "too-many-statements", "too-many-branches", "too-many-return-statements", "too-many-arguments", "too-many-positional-arguments", "duplicate-code"]
[tool.pylint.format]
max-line-length = 88
